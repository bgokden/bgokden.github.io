name: CV PDF

# Re-render Berk_Gokden_CV.pdf from index.html on every change, so the
# downloadable PDF never goes stale.

on:
  push:
    branches: [main]
    paths: ["index.html"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cv-pdf
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install fonts for consistent rendering
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: Render PDF
        run: |
          "${{ steps.chrome.outputs.chrome-path }}" \
            --headless --disable-gpu --no-sandbox --no-pdf-header-footer \
            --print-to-pdf=Berk_Gokden_CV.pdf "file://$PWD/index.html"

      - name: Commit regenerated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Berk_Gokden_CV.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "chore: auto-regenerate CV PDF [skip ci]"
            git push
          fi
